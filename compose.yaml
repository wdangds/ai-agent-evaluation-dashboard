# Local development only. Render deploys from the Dockerfile and
# provides its own database connection.

services:
  app:
    build: .
    env_file: .env
    ports:
      - "8050:8050"
    volumes:
      - .:/app
    depends_on:
      - db
    networks:
      - agent-network

  db:
    image: postgres:18.6
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    networks:
      - agent-network

volumes:
  pgdata:

networks:
  agent-network:
